<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Zekra | Master HQ Access 🔑</title>
    <link rel="icon" type="image/png" href="assets/logo.png?v=4.4.0">

    <!-- Firebase SDKs (Required for SanctuaryEngine v2.0) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="firebase-config.js?v=4.4.0"></script>
    <script src="sanctuary-engine.js?v=4.4.0"></script>
    <script>
        // Suppress Tailwind warning
        const originalWarn = console.warn;
        console.warn = (...args) => {
            if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn(...args);
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --z-gold: #FFD700;
            --z-bg: #0A0A0A;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            background: var(--z-bg);
            font-family: 'Poppins', sans-serif;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .m-logo-circle {
            width: 140px;
            height: 140px;
            background: #111;
            border: 2px solid var(--z-gold);
            border-radius: 50%;
            margin: 0 auto 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .z-title {
            color: var(--z-gold);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .z-subtitle {
            color: #9e9e9e;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 45px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .inp-label {
            display: block;
            text-align: left;
            font-size: 11px;
            font-weight: 900;
            color: var(--z-gold);
            margin-left: 20px;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }

        .z-inp-wrap {
            margin-bottom: 25px;
        }

        .z-inp {
            width: 100%;
            background: #151515;
            border-radius: 20px;
            padding: 20px 25px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            border: 1px solid #333;
            outline: none;
            transition: all 0.3s;
        }

        .z-inp:focus {
            border-color: var(--z-gold);
            background: #1A1A1A;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .z-btn {
            width: 100%;
            background: var(--z-gold);
            color: black;
            border-radius: 20px;
            padding: 20px;
            font-size: 18px;
            font-weight: 900;
            margin-top: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .z-btn:active {
            transform: scale(0.96);
        }

        .status-area {
            min-height: 25px;
            margin-top: 25px;
            font-size: 13px;
            font-weight: 700;
            color: #ff4d4d;
        }

        .shake {
            animation: shakeAnim 0.4s;
        }

        @keyframes shakeAnim {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }
    </style>
</head>

<body>

    <div class="login-container" id="login-container">
        <div class="m-logo-circle">
            <i class="ri-shield-keyhole-fill text-6xl text-[#FFD700]"></i>
        </div>

        <h1 class="z-title">MASTER HQ</h1>
        <p class="z-subtitle">Administrative Terminal Access</p>

        <form id="authForm" novalidate>
            <div class="z-inp-wrap">
                <span class="inp-label">ADMIN IDENTITY</span>
                <input type="text" id="username" placeholder="Enter ID..." required class="z-inp"
                    autocomplete="username">
            </div>

            <div class="z-inp-wrap">
                <span class="inp-label">ENCRYPTION KEY</span>
                <input type="password" id="password" placeholder="Enter Password..." required class="z-inp"
                    autocomplete="current-password">
            </div>

            <button type="submit" id="submitBtn" class="z-btn">
                Initialize HQ Sync ⚡
            </button>
        </form>

        <div id="status" class="status-area"></div>
    </div>

    <script>
        const form = document.getElementById('authForm');
        const status = document.getElementById('status');
        const container = document.getElementById('login-container');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (!u || !p) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i> Authorizing...';
            status.innerHTML = "";

            try {
                const authResult = await SanctuaryEngine.login(u, p);

                if (authResult.role !== 'master') {
                    throw new Error("❌ Access Denied: User account detected in Admin Portal.");
                }

                status.innerHTML = "Sync Authorized. Welcome, Master.";
                status.style.color = "#FFD700";
                btn.innerHTML = 'Opening HQ...';

                setTimeout(() => {
                    window.location.replace('vault.html#hq');
                }, 350);

            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = 'Initialize HQ Sync ⚡';
                status.innerHTML = err.message;
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);
            }
        });
    </script>
</body>

</html>
