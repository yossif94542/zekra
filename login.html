<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zekra 🌸</title>
    <link rel="icon" href="assets/logo.svg">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="sanctuary-engine.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FFF5F7;
            font-family: 'Poppins', sans-serif;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .c {
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: #000;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        h1 { color: #E91E63; font-size: 36px; font-weight: 900; letter-spacing: -1px; }
        .sub { font-family: 'Dancing Script', cursive; color: #999; font-size: 18px; margin-bottom: 25px; }
        .lbl { display: block; text-align: left; font-size: 10px; font-weight: 900; color: #ff85a1; margin-left: 12px; margin-bottom: 4px; letter-spacing: 1px; }
        .w { margin-bottom: 15px; }
        .i {
            width: 100%;
            background: #fff;
            border-radius: 25px;
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #E91E63;
            border: none;
            box-shadow: 0 3px 10px rgba(0,0,0,0.02);
            outline: none;
        }
        .i::placeholder { color: #ffc1d3; }
        .btn {
            width: 100%;
            background: #F06292;
            color: #fff;
            border-radius: 25px;
            padding: 16px;
            font-size: 17px;
            font-weight: 800;
            margin-top: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(240,98,146,0.3);
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.6; }
        .st { min-height: 20px; margin-top: 15px; font-size: 12px; font-weight: 700; color: #E91E63; }
        .shake { animation: s 0.4s; }
        @keyframes s { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
        @keyframes fi { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .c { animation: fi 0.6s ease-out; }
    </style>
</head>
<body>
<div class="c">
    <div class="logo"><img src="assets/logo.svg" alt="logo"></div>
    <h1>zekra</h1>
    <p class="sub">Our little secret world 💕</p>
    <form id="f">
        <div class="w"><span class="lbl">NAME</span><input type="text" id="u" placeholder="who are you? 🌸" class="i"></div>
        <div class="w"><span class="lbl">PASSWORD</span><input type="password" id="p" placeholder="our secret... 🔒" class="i"></div>
        <button type="submit" id="b" class="btn">Enter Our World 💖</button>
    </form>
    <div id="s" class="st"></div>
</div>
<script>
var f=document.getElementById('f'),s=document.getElementById('s'),c=document.querySelector('.c'),b=document.getElementById('b');
window.addEventListener('load',function(){
    localStorage.removeItem('zekra_lock_status');
    var t=new URLSearchParams(window.location.search).get('t');
    if(t){
        b.disabled=true; b.textContent='⏳';
        SanctuaryEngine.loginWithToken(t).then(function(){window.location.href='vault.html'}).catch(function(e){
            b.disabled=false; b.textContent='Enter Our World 💖'; s.textContent=e.message;
        });
    }
});
f.addEventListener('submit',function(e){
    e.preventDefault();
    var u=document.getElementById('u').value.trim().toLowerCase(),pw=document.getElementById('p').value.trim();
    if(!u||!pw)return;
    b.disabled=true; b.textContent='⏳ Authenticating...'; s.textContent='';
    SanctuaryEngine.login(u,pw).then(function(result){
        s.textContent='Welcome back ✨'; s.style.color='#4caf50';
        var target = 'vault.html';
        if (result && result.role === 'master') target = 'vault.html#hq';
        setTimeout(function(){window.location.replace(target)},300);
    }).catch(function(err){
        b.disabled=false; b.textContent='Enter Our World 💖'; s.textContent=err.message; s.style.color='#E91E63';
        c.classList.add('shake'); setTimeout(function(){c.classList.remove('shake')},500);
    });
});
</script>
</body>
</html>
