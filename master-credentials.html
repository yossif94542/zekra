<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 بيانات الماستر</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0A0A0A;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;direction:rtl}
        .c{max-width:420px;width:100%;padding:30px;text-align:center}
        h1{font-size:26px;color:#FFD700;margin-bottom:6px}
        .sub{color:#888;font-size:13px;margin-bottom:30px}
        .card{background:#151515;border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:20px;text-align:right}
        .card .lbl{color:#FFD700;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
        .card .val{color:#ccc;font-size:15px;font-family:monospace;margin-bottom:14px;background:#0d0d0d;padding:8px 12px;border-radius:8px;direction:ltr;text-align:left}
        .btn{width:100%;padding:16px;border-radius:14px;font-size:15px;font-weight:900;border:none;cursor:pointer;text-transform:uppercase;transition:.3s;margin-bottom:10px}
        .btn-gold{background:#FFD700;color:#000}
        .btn-gold:hover{opacity:.9}
        .btn-outline{background:transparent;color:#FFD700;border:1px solid #FFD700}
        .btn-outline:hover{background:rgba(255,215,0,.1)}
        .note{color:#555;font-size:10px;margin-top:20px}
    </style>
</head>
<body>
<div class="c">
    <div style="font-size:48px;margin-bottom:12px">🛡️</div>
    <h1>بيانات حساب الماستر</h1>
    <p class="sub">ده الحساب الرئيسي بتاعك — احتفظ بيه</p>

    <div class="card">
        <div class="lbl">👤 اسم المستخدم</div>
        <div class="val" id="uname">admin_zekra_9454</div>
        
        <div class="lbl">📧 البريد الإلكتروني</div>
        <div class="val" id="email">admin_zekra_9454@zekra.com</div>
        
        <div class="lbl">🔑 كلمة السر</div>
        <div class="val" id="pass">Master2026!</div>
    </div>

    <button class="btn btn-gold" onclick="copyAll()">📋 نسخ كل البيانات</button>
    <button class="btn btn-outline" onclick="openLogin()">🚪 الذهاب إلى تسجيل الدخول</button>

    <div id="msg" style="margin-top:12px;font-size:13px;font-weight:700;color:#4ade80"></div>
    <div class="note">⚠️ لو عاوز تغير كلمة السر، سجل دخول وخليك في vault.html</div>
</div>

<script>
function copyAll() {
    var txt = "Username: admin_zekra_9454\nEmail: admin_zekra_9454@zekra.com\nPassword: Master2026!";
    navigator.clipboard.writeText(txt).then(function() {
        document.getElementById('msg').textContent = '✅ تم نسخ البيانات!';
    }).catch(function() {
        document.getElementById('msg').textContent = '❌ فشل النسخ، انسخ يدوي';
    });
}

function openLogin() {
    window.location.href = 'login.html';
}
</script>
</body>
</html>
